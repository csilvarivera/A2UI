[project]
name = "a2ui-field-service-assistant"
version = "0.1.0"
description = "Sample Google ADK-based Field Service Assistant agent that uses a2ui UI for HVAC technicians."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.8",
    "google-adk>=0.1.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.1.0",
    "jsonschema>=4.0.0",
    "a2a-sdk>=0.3.0",
    "starlette>=0.36.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
